<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | Smart Attendance</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js"></script>
</head>
<body>
    <header>
        <h2>Smart Attendance</h2>
        <nav>
            <!-- Dynamically injected -->
        </nav>
    </header>
    
    <main class="container fade-in">
        <h1>Student Dashboard</h1>
        <p>Welcome, <span id="studentName">Student</span>. Here's your quick access panel.</p>
        
        <div class="card-grid">
            <a href="scan-qr.html" class="card" style="text-decoration: none;">
                <h3 style="color: var(--primary); font-size: 1.5rem; margin-bottom: 0.5rem;">📸</h3>
                <h3>Scan QR</h3>
                <p style="margin-bottom: 0; font-size: 0.9rem;">Mark attendance for current class</p>
            </a>
            
            <a href="my-attendance.html" class="card" style="text-decoration: none;">
                <h3 style="color: var(--secondary); font-size: 1.5rem; margin-bottom: 0.5rem;">📊</h3>
                <h3>My Attendance</h3>
                <p style="margin-bottom: 0; font-size: 0.9rem;">View history & semester statistics</p>
            </a>
        </div>
    </main>
</body>
</html>
